name: Featured Picks

# 今日精选 (featured picks) daily image pass — see docs/explore/premium-listing-photos/plan/.
# Picks today's new Subito listings (≤15 per city), cuts the item out onto a neutral studio
# background (open model, non-generative), rejects anything near the Subito watermark, uploads
# passing 400x500 WebP files to the `featured-photos` bucket as `pending`, and messages the owner
# to review them at /admin/featured. Nothing is public until the owner approves it.
#
# Cost: ~15–25 runner minutes/day (~600 min/month) on top of subito-scheduler (~900) — inside
# the 2000 free minutes for private repos. Work stops after FEATURED_MAX_MINUTES; hard cap 40.

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch: {}

concurrency:
  group: featured-picks
  cancel-in-progress: false

jobs:
  featured-tick:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scraper/package-lock.json

      - name: Install scraper dependencies
        working-directory: scraper
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            scraper/featured/requirements.txt
            scraper/featured/requirements-nodeps.txt

      - name: Install image pipeline
        working-directory: scraper/featured
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -r requirements-nodeps.txt

      - name: Cache cutout model
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: u2net-birefnet-general-lite-v1

      - name: Test image pipeline
        working-directory: scraper/featured
        run: python -m pytest -q

      - name: Run featured tick
        working-directory: scraper
        env:
          FEATURED_PYTHON: python
          FEATURED_MAX_MINUTES: '25'
          APP_URL: ${{ vars.APP_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPER_SECRETS_KEY: ${{ secrets.SCRAPER_SECRETS_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: node --import tsx src/worker.ts -- --featured-tick
