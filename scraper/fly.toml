# Optional legacy-free fallback only (D-07-67). Default production path scales this app to 0
# and uses GitHub Actions `.github/workflows/subito-scheduler.yml` instead (D-07-66).
app = "shoumanwu-scraper"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"
  context = ".."

[env]
  CRON_ENABLED = "true"
  CRAWLEE_PERSIST_STORAGE = "false"
  NODE_OPTIONS = "--max-old-space-size=256"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[[restart]]
  policy = "always"

kill_signal = "SIGTERM"
kill_timeout = "120s"
