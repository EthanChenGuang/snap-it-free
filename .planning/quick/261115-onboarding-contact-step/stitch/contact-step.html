<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>新手引导 - 中文联系助手</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,600,0,0" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#FFF1E6',
            navy: '#1A1A2E',
            primaryOrange: '#F4522D',
            highlightYellow: '#FFC83D',
            sparkleTeal: '#2DD4BF',
            subText: '#4A4A68',
            cardBg: '#FFFFFF',
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Noto Sans SC"', 'sans-serif'],
          },
          boxShadow: {
            'pop-sm': '2.5px 2.5px 0px #1A1A2E',
            'pop': '3.5px 3.5px 0px #1A1A2E',
            'pop-lg': '4.5px 4.5px 0px #1A1A2E',
            'pop-btn': '0px 5px 0px #1A1A2E',
          },
          borderRadius: {
            'pop': '28px',
            'pop-card': '20px',
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans SC', sans-serif;
      background-color: #FFF1E6;
      color: #1A1A2E;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .stroke-navy-3 {
      border: 3px solid #1A1A2E;
    }
    .stroke-navy-2\.5 {
      border: 2.5px solid #1A1A2E;
    }
    .shadow-hard-card {
      box-shadow: 3.5px 3.5px 0px #1A1A2E;
    }
    .shadow-hard-btn {
      box-shadow: 3.5px 4px 0px #1A1A2E;
    }
    .shadow-hard-bubble {
      box-shadow: 4px 4px 0px #1A1A2E;
    }
    .sparkle {
      position: absolute;
      pointer-events: none;
    }
  </style>
</head>
<body class="bg-cream min-h-screen flex items-center justify-center p-0 m-0">

  <!-- Mobile Container (390 x 844) -->
  <main class="w-[390px] h-[844px] bg-cream relative overflow-hidden flex flex-col justify-between px-6 pt-5 pb-7 border border-navy/10 shadow-2xl mx-auto box-border">

    <!-- Sparkle Decorations -->
    <!-- Teal 4-point sparkle top-left -->
    <svg class="sparkle top-14 left-7 w-5 h-5 text-sparkleTeal animate-pulse" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 0L14.4 9.6L24 12L14.4 14.4L12 24L9.6 14.4L0 12L9.6 9.6L12 0Z"/>
    </svg>
    <!-- Orange star top-right -->
    <svg class="sparkle top-20 right-8 w-4 h-4 text-primaryOrange" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 0L14.4 9.6L24 12L14.4 14.4L12 24L9.6 14.4L0 12L9.6 9.6L12 0Z"/>
    </svg>
    <!-- Tiny Yellow diamond decoration mid-right -->
    <div class="sparkle top-44 right-5 w-2.5 h-2.5 bg-highlightYellow border border-navy rotate-45"></div>
    <!-- Teal star mid-left -->
    <svg class="sparkle top-[46%] left-4 w-4 h-4 text-sparkleTeal" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 0L14.4 9.6L24 12L14.4 14.4L12 24L9.6 14.4L0 12L9.6 9.6L12 0Z"/>
    </svg>
    <!-- Small Orange sparkle near bottom -->
    <svg class="sparkle bottom-28 right-5 w-3.5 h-3.5 text-primaryOrange" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 0L14.4 9.6L24 12L14.4 14.4L12 24L9.6 14.4L0 12L9.6 9.6L12 0Z"/>
    </svg>

    <!-- SECTION 1: Top Navigation Bar -->
    <header class="flex items-center justify-between w-full z-20 pt-1">
      <!-- Round Language Chip -->
      <div class="w-8 h-8 rounded-full bg-white stroke-navy-2.5 shadow-pop-sm flex items-center justify-center font-bold text-navy text-xs tracking-tight">
        中
      </div>

      <!-- 13 Progress Dots -->
      <div class="flex items-center gap-[5.5px]">
        <!-- 1 -->
        <span class="w-[5.5px] h-[5.5px] rounded-full bg-navy/20"></span>
        <!-- 2 -->
        <span class="w-[5.5px] h-[5.5px] rounded-full bg-navy/20"></span>
        <!-- 3 -->
        <span class="w-[5.5px] h-[5.5px] rounded-full bg-navy/20"></span>
        <!-- 4 -->
        <span class="w-[5.5px] h-[5.5px] rounded-full bg-navy/20"></span>
        <!-- 5 -->
        <span class="w-[5.5px] h-[5.5px] rounded-full bg-navy/20"></span>
        <!-- 6 (Active: Orange, slightly larger with outline) -->
        <span class="w-[8.5px] h-[8.5px] rounded-full bg-primaryOrange border-[1.5px] border-navy shadow-[1px_1px_0px_#1A1A2E]"></span>
        <!-- 7 -->
        <span class="w-[5.5px] h-[5.5px] rounded-full bg-navy/20"></span>
        <!-- 8 -->
        <span class="w-[5.5px] h-[5.5px] rounded-full bg-navy/20"></span>
        <!-- 9 -->
        <span class="w-[5.5px] h-[5.5px] rounded-full bg-navy/20"></span>
        <!-- 10 -->
        <span class="w-[5.5px] h-[5.5px] rounded-full bg-navy/20"></span>
        <!-- 11 -->
        <span class="w-[5.5px] h-[5.5px] rounded-full bg-navy/20"></span>
        <!-- 12 -->
        <span class="w-[5.5px] h-[5.5px] rounded-full bg-navy/20"></span>
        <!-- 13 -->
        <span class="w-[5.5px] h-[5.5px] rounded-full bg-navy/20"></span>
      </div>

      <!-- Skip Button -->
      <button class="text-sm font-bold text-subText hover:text-navy transition-colors px-1 py-0.5">
        跳过
      </button>
    </header>

    <!-- SECTION 2: Hero Illustration Area (Top 40%) -->
    <div class="relative w-full h-[240px] flex items-center justify-center my-1">
      <!-- Decorative circle blob behind -->
      <div class="absolute w-52 h-52 bg-white/40 rounded-full blur-sm -z-0"></div>

      <!-- Bubble 1: Italian Bubble (Top, White, slightly tilted left -3deg) -->
      <div class="absolute top-4 left-4 z-10 -rotate-[3deg] bg-white stroke-navy-3 rounded-pop px-5 py-3.5 shadow-hard-bubble max-w-[270px]">
        <div class="flex items-center gap-1.5 mb-0.5">
          <span class="inline-block w-2 h-2 rounded-full bg-primaryOrange"></span>
          <span class="text-[10.5px] font-extrabold uppercase tracking-wider text-subText">Italiano</span>
        </div>
        <p class="text-navy font-extrabold text-[15px] leading-snug tracking-tight font-sans">
          “ Ciao! È ancora disponibile? ”
        </p>
      </div>

      <!-- Translate Icon Badge (Center connector) -->
      <div class="absolute top-[88px] left-[175px] z-30 w-11 h-11 bg-primaryOrange rounded-full stroke-navy-2.5 shadow-pop flex items-center justify-center text-white transform hover:scale-105 transition-transform">
        <span class="material-symbols-rounded text-[21px] font-bold">translate</span>
      </div>

      <!-- Bubble 2: Chinese Bubble (Bottom, Yellow, tilted right +2.5deg) -->
      <div class="absolute top-[124px] right-3 z-20 rotate-[2.5deg] bg-highlightYellow stroke-navy-3 rounded-pop px-5 py-3.5 shadow-hard-bubble max-w-[250px]">
        <div class="flex items-center gap-1.5 mb-0.5">
          <span class="inline-block w-2 h-2 rounded-full bg-navy"></span>
          <span class="text-[10.5px] font-extrabold text-navy/70">中文</span>
        </div>
        <p class="text-navy font-black text-[16px] leading-snug tracking-tight">
          “ 你好！还在吗？ ”
        </p>
      </div>
    </div>

    <!-- SECTION 3: Headline & Sub-headline -->
    <div class="text-center px-1">
      <h1 class="text-[28px] font-black text-navy leading-[1.25] tracking-tight">
        <div>不会意大利语？</div>
        <div class="mt-1 flex items-center justify-center gap-1.5">
          <!-- Highlight Pill behind "也能" -->
          <span class="inline-flex items-center justify-center bg-highlightYellow px-3.5 py-0.5 rounded-full stroke-navy-2.5 shadow-pop-sm text-navy font-black">
            也能
          </span>
          <span>联系卖家</span>
        </div>
      </h1>

      <p class="mt-2.5 text-[13.5px] font-bold text-subText leading-relaxed px-2">
        卖家都说意大利语。我们帮你写消息、看懂回复。
      </p>
    </div>

    <!-- SECTION 4: Three Compact Numbered Rows -->
    <div class="flex flex-col gap-2.5 w-full my-auto">
      
      <!-- Row 1 -->
      <div class="bg-white stroke-navy-2.5 rounded-pop-card p-2.5 px-3.5 flex items-center gap-3 shadow-hard-card transform hover:-translate-y-0.5 transition-transform">
        <div class="w-7 h-7 rounded-full bg-highlightYellow stroke-navy-2 flex items-center justify-center font-black text-navy text-sm shadow-[1.5px_1.5px_0px_#1A1A2E] shrink-0">
          1
        </div>
        <span class="text-[13.5px] font-extrabold text-navy tracking-tight leading-snug">
          选一条现成的意大利语消息
        </span>
      </div>

      <!-- Row 2 -->
      <div class="bg-white stroke-navy-2.5 rounded-pop-card p-2.5 px-3.5 flex items-center gap-3 shadow-hard-card transform hover:-translate-y-0.5 transition-transform">
        <div class="w-7 h-7 rounded-full bg-sparkleTeal stroke-navy-2 flex items-center justify-center font-black text-navy text-sm shadow-[1.5px_1.5px_0px_#1A1A2E] shrink-0">
          2
        </div>
        <span class="text-[13.5px] font-extrabold text-navy tracking-tight leading-snug">
          一键复制，到卖家页面粘贴发送
        </span>
      </div>

      <!-- Row 3 -->
      <div class="bg-white stroke-navy-2.5 rounded-pop-card p-2.5 px-3.5 flex items-center gap-3 shadow-hard-card transform hover:-translate-y-0.5 transition-transform">
        <div class="w-7 h-7 rounded-full bg-primaryOrange stroke-navy-2 flex items-center justify-center font-black text-white text-sm shadow-[1.5px_1.5px_0px_#1A1A2E] shrink-0">
          3
        </div>
        <span class="text-[13.5px] font-extrabold text-navy tracking-tight leading-snug">
          把回复贴回来，马上看到中文意思
        </span>
      </div>

    </div>

    <!-- SECTION 5: Bottom CTA Button -->
    <div class="w-full pt-1">
      <button class="w-full h-[58px] bg-primaryOrange stroke-navy-3 rounded-pop text-white font-black text-[18px] tracking-wide flex items-center justify-center gap-2 shadow-hard-btn active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all">
        <span>继续</span>
        <span class="text-xl">→</span>
      </button>
    </div>

  </main>

</body>
</html>
